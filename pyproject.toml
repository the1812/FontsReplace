[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fonts_replace"
version = "0.1.0"
description = "Generate system-identity fonts from replacement TrueType faces"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["fonttools>=4.58.4,<5"]

[project.scripts]
fonts_replace = "fonts_replace.cli:main"

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "FURB", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/fonts_replace"]

[dependency-groups]
dev = ["ruff>=0.16.7"]
